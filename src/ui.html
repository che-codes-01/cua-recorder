<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>cua-record</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --surface:  #181b23;
    --border:   #2a2d3a;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --accent:   #6366f1;
    --red:      #ef4444;
    --green:    #22c55e;
    --yellow:   #eab308;
    --blue:     #3b82f6;
    --cyan:     #06b6d4;
    --purple:   #a855f7;

    --toolbar-h: 56px;
    --status-h:  36px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }

  /* ── Toolbar ── */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--toolbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; padding: 0 16px;
    z-index: 100;
  }

  .logo {
    font-weight: 700; font-size: 15px; letter-spacing: -.3px;
    color: var(--accent); margin-right: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .logo svg { opacity: .9; }

  .sep { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }

  button {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 14px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background .12s, border-color .12s, opacity .12s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: rgba(255,255,255,.06); border-color: #3a3d4e; }
  button:active:not(:disabled) { background: rgba(255,255,255,.10); }
  button:disabled { opacity: .38; cursor: not-allowed; }

  #btn-record  { color: var(--red);    border-color: rgba(239,68,68,.4); }
  #btn-record:hover:not(:disabled)  { background: rgba(239,68,68,.12); }
  #btn-record.active { background: rgba(239,68,68,.18); border-color: var(--red); }

  #btn-stop    { color: var(--yellow); border-color: rgba(234,179,8,.4); }
  #btn-stop:hover:not(:disabled)    { background: rgba(234,179,8,.12);  }

  #btn-save    { color: var(--green);  border-color: rgba(34,197,94,.4); }
  #btn-save:hover:not(:disabled)    { background: rgba(34,197,94,.12);  }

  #btn-clear   { color: var(--muted); }

  .wf-name-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  #wf-name {
    background: transparent; border: 1px solid transparent; outline: none;
    color: var(--text); font-size: 13px; padding: 4px 8px; border-radius: 5px;
    width: 220px;
    transition: border-color .15s;
  }
  #wf-name:focus { border-color: var(--accent); background: rgba(99,102,241,.07); }
  #wf-name::placeholder { color: var(--muted); }

  .count-badge {
    font-size: 11px; background: rgba(99,102,241,.2); color: var(--accent);
    border-radius: 20px; padding: 2px 9px; min-width: 36px; text-align: center;
    transition: background .2s;
  }
  .count-badge.rec { background: rgba(239,68,68,.2); color: var(--red); }

  /* ── Status bar ── */
  #statusbar {
    position: fixed; top: var(--toolbar-h); left: 0; right: 0; height: var(--status-h);
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 8px;
    font-size: 12px; color: var(--muted); z-index: 99;
  }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
    flex-shrink: 0; transition: background .2s;
  }
  #status-dot.idle     { background: var(--muted); }
  #status-dot.rec      { background: var(--red); animation: pulse 1s infinite; }
  #status-dot.stopped  { background: var(--yellow); }
  #status-dot.saved    { background: var(--green); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #status-text { color: var(--text); }

  /* ── Action list ── */
  #main {
    margin-top: calc(var(--toolbar-h) + var(--status-h));
    height: calc(100vh - var(--toolbar-h) - var(--status-h) - var(--status-h));
    overflow-y: auto;
    padding: 0;
  }

  #empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 12px; color: var(--muted); opacity: .5;
    pointer-events: none; user-select: none;
  }
  #empty-state svg { opacity: .4; }
  #empty-state p { font-size: 13px; }

  .action-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 9px 16px;
    border-bottom: 1px solid rgba(255,255,255,.04);
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
  .action-row:hover { background: rgba(255,255,255,.03); }

  .action-num {
    min-width: 28px; text-align: right;
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    padding-top: 1px;
  }
  .action-icon {
    width: 22px; height: 22px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
  }
  .action-body { flex: 1; min-width: 0; }
  .action-type {
    font-weight: 600; font-size: 12px; margin-bottom: 2px;
  }
  .action-params {
    font-size: 11px; color: var(--muted); font-family: "SF Mono", "Fira Code", monospace;
    word-break: break-all;
  }

  /* Type colours */
  .t-left_click    { color: var(--blue);   background: rgba(59,130,246,.15); }
  .t-double_click  { color: var(--cyan);   background: rgba(6,182,212,.15);  }
  .t-right_click   { color: var(--purple); background: rgba(168,85,247,.15); }
  .t-type          { color: var(--green);  background: rgba(34,197,94,.15);  }
  .t-key           { color: var(--yellow); background: rgba(234,179,8,.15);  }
  .t-hotkey        { color: var(--yellow); background: rgba(234,179,8,.15);  }
  .t-scroll        { color: var(--muted);  background: rgba(100,116,139,.15);}
  .t-default       { color: var(--text);   background: rgba(255,255,255,.07);}

  /* ── Footer / save panel ── */
  #footer {
    position: fixed; bottom: 0; left: 0; right: 0; height: var(--status-h);
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
    font-size: 12px; color: var(--muted); z-index: 99;
  }
  #saved-path { flex: 1; font-family: monospace; font-size: 11px; color: var(--green); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Modal overlay ── */
  #modal {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.7); align-items: center; justify-content: center;
  }
  #modal.open { display: flex; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    width: 560px; max-width: 95vw; padding: 24px;
  }
  .modal-box h2 { font-size: 15px; margin-bottom: 16px; }
  .modal-box pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; font-size: 11px; font-family: monospace;
    max-height: 40vh; overflow-y: auto; color: var(--text);
    white-space: pre-wrap; word-break: break-all;
  }
  .modal-actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
  #copy-btn { color: var(--accent); border-color: rgba(99,102,241,.4); }
</style>
</head>
<body>

<!-- ── Toolbar ── -->
<div id="toolbar">
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="9" cy="9" r="8" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="9" cy="9" r="3.5" fill="#6366f1"/>
    </svg>
    cua-record
  </div>
  <div class="sep"></div>

  <button id="btn-record" title="Start recording (R)">
    <svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="currentColor"/></svg>
    Record
  </button>
  <button id="btn-stop" disabled title="Stop recording (S)">
    <svg width="10" height="10" viewBox="0 0 10 10"><rect width="10" height="10" rx="2" fill="currentColor"/></svg>
    Stop
  </button>
  <div class="sep"></div>
  <button id="btn-clear" disabled title="Clear (C)">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M2 2l8 8M10 2l-8 8"/>
    </svg>
    Clear
  </button>
  <div class="sep"></div>
  <button id="btn-save" disabled title="Save workflow JSON (W)">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M6 1v7M3 5l3 3 3-3M1 9v1a1 1 0 001 1h8a1 1 0 001-1V9"/>
    </svg>
    Save JSON
  </button>

  <div class="sep"></div>
  <div class="wf-name-wrap">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4">
      <path d="M2 1h8M2 4h8M2 7h5"/>
    </svg>
    <input id="wf-name" type="text" placeholder="Workflow name…" spellcheck="false" />
  </div>

  <div class="count-badge" id="count">0 actions</div>
</div>

<!-- ── Status bar ── -->
<div id="statusbar">
  <div id="status-dot" class="idle"></div>
  <span id="status-text">Ready — click Record to start</span>
</div>

<!-- ── Action list ── -->
<div id="main">
  <div id="empty-state">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="24" cy="24" r="20"/>
      <circle cx="24" cy="24" r="7"/>
    </svg>
    <p>Press <b>Record</b> then interact with your screen</p>
    <p style="font-size:11px">Mouse clicks, keyboard, scroll — all captured automatically</p>
  </div>
  <div id="action-list" style="display:none"></div>
</div>

<!-- ── Footer ── -->
<div id="footer">
  <span id="saved-path"></span>
  <button id="btn-view-json" style="margin-left:auto" disabled>View JSON</button>
</div>

<!-- ── JSON modal ── -->
<div id="modal">
  <div class="modal-box">
    <h2>Workflow JSON</h2>
    <pre id="json-preview"></pre>
    <div class="modal-actions">
      <button id="copy-btn">Copy to clipboard</button>
      <button id="download-btn">Download</button>
      <button id="close-modal">Close</button>
    </div>
  </div>
</div>

<script>
// ── Icon map ──────────────────────────────────────────────────────────────────
const ICONS = {
  left_click:   '🖱',
  double_click: '🖱',
  right_click:  '🖱',
  type:         '⌨',
  key:          '⬆',
  hotkey:       '⌨',
  scroll:       '↕',
};

function typeClass(t) {
  return `t-${t}`;
}

function humanise(type) {
  return type.split('_').map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
}

function fmtParams(action) {
  const parts = [];
  const skip = new Set(['type']);
  for (const [k, v] of Object.entries(action)) {
    if (skip.has(k)) continue;
    parts.push(`${k}: ${JSON.stringify(v)}`);
  }
  return parts.join('   ');
}

// ── DOM refs ──────────────────────────────────────────────────────────────────
const btnRecord   = document.getElementById('btn-record');
const btnStop     = document.getElementById('btn-stop');
const btnClear    = document.getElementById('btn-clear');
const btnSave     = document.getElementById('btn-save');
const btnViewJson = document.getElementById('btn-view-json');
const btnCopy     = document.getElementById('copy-btn');
const btnDownload = document.getElementById('download-btn');
const btnClose    = document.getElementById('close-modal');
const statusDot   = document.getElementById('status-dot');
const statusText  = document.getElementById('status-text');
const countBadge  = document.getElementById('count');
const wfNameInput = document.getElementById('wf-name');
const actionList  = document.getElementById('action-list');
const emptyState  = document.getElementById('empty-state');
const savedPath   = document.getElementById('saved-path');
const modal       = document.getElementById('modal');
const jsonPreview = document.getElementById('json-preview');
const main        = document.getElementById('main');

// ── State ─────────────────────────────────────────────────────────────────────
let recording  = false;
let actionCount = 0;
let savedFile  = null;
let lastWorkflow = null;

// ── Rendering ─────────────────────────────────────────────────────────────────
function renderAction(action, index) {
  const type = action.type || 'unknown';
  const row  = document.createElement('div');
  row.className = 'action-row';
  row.id = `action-${index}`;

  const tc = typeClass(type);
  row.innerHTML = `
    <span class="action-num">${index + 1}</span>
    <span class="action-icon ${tc}">${ICONS[type] || '●'}</span>
    <div class="action-body">
      <div class="action-type ${tc}">${humanise(type)}</div>
      <div class="action-params">${fmtParams(action)}</div>
    </div>
  `;
  return row;
}

function appendAction(action, index) {
  if (actionCount === 0) {
    emptyState.style.display = 'none';
    actionList.style.display = 'block';
  }
  const row = renderAction(action, index);
  actionList.appendChild(row);
  main.scrollTop = main.scrollHeight;
}

function updateCount(n) {
  actionCount = n;
  countBadge.textContent = `${n} action${n === 1 ? '' : 's'}`;
  countBadge.className = `count-badge${recording ? ' rec' : ''}`;
}

function setRecording(val) {
  recording = val;
  btnRecord.disabled = val;
  btnRecord.classList.toggle('active', val);
  btnStop.disabled   = !val;
  btnClear.disabled  = false;
  btnSave.disabled   = val || actionCount === 0;
  statusDot.className = val ? 'rec' : (actionCount > 0 ? 'stopped' : 'idle');
  statusText.textContent = val
    ? 'Recording — interact with your screen…'
    : (actionCount > 0 ? `Stopped — ${actionCount} action${actionCount===1?'':'s'} captured` : 'Ready — click Record to start');
  updateCount(actionCount);
}

function clearAll() {
  actionList.innerHTML = '';
  actionList.style.display = 'none';
  emptyState.style.display = '';
  actionCount = 0;
  savedFile = null;
  savedPath.textContent = '';
  btnSave.disabled = true;
  btnViewJson.disabled = true;
  setRecording(false);
  updateCount(0);
  statusText.textContent = 'Ready — click Record to start';
}

// ── Control calls ─────────────────────────────────────────────────────────────
async function ctrl(cmd) {
  await fetch('/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd }) });
}

async function save() {
  const name = wfNameInput.value.trim() || 'Recorded Workflow';
  const res  = await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
  const data = await res.json();
  if (data.ok) {
    savedFile = data.file;
    lastWorkflow = data.workflow;
    savedPath.textContent = `✓ Saved → ${data.file}`;
    btnViewJson.disabled = false;
    statusDot.className  = 'saved';
    statusText.textContent = `Saved — ${data.file}`;
  }
}

// ── Toolbar bindings ──────────────────────────────────────────────────────────
btnRecord.addEventListener('click', () => ctrl('start'));
btnStop  .addEventListener('click', () => ctrl('stop'));
btnClear .addEventListener('click', () => { ctrl('clear'); clearAll(); });
btnSave  .addEventListener('click', save);

btnViewJson.addEventListener('click', async () => {
  const res = await fetch('/workflow');
  lastWorkflow = await res.json();
  jsonPreview.textContent = JSON.stringify(lastWorkflow, null, 2);
  modal.classList.add('open');
});
btnCopy.addEventListener('click', () => {
  navigator.clipboard.writeText(jsonPreview.textContent).then(() => {
    btnCopy.textContent = 'Copied!';
    setTimeout(() => btnCopy.textContent = 'Copy to clipboard', 1500);
  });
});
btnDownload.addEventListener('click', () => {
  const blob = new Blob([jsonPreview.textContent], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (wfNameInput.value.trim() || 'workflow').replace(/\s+/g, '-').toLowerCase() + '.json';
  a.click();
});
btnClose.addEventListener('click', () => modal.classList.remove('open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target === wfNameInput) return;
  if (e.key === 'r' || e.key === 'R') { if (!recording) ctrl('start'); }
  if (e.key === 's' || e.key === 'S') { if (recording)  ctrl('stop'); }
  if (e.key === 'w' || e.key === 'W') { if (!btnSave.disabled) save(); }
  if (e.key === 'c' || e.key === 'C') { ctrl('clear'); clearAll(); }
  if (e.key === 'Escape') modal.classList.remove('open');
});

// ── SSE connection ────────────────────────────────────────────────────────────
function connect() {
  const es = new EventSource('/events');

  es.addEventListener('init', e => {
    const data = JSON.parse(e.data);
    wfNameInput.value = data.wfName || '';
    if (data.actions?.length) {
      clearAll();
      data.actions.forEach((a, i) => appendAction(a, i));
      updateCount(data.actions.length);
    }
    setRecording(data.recording || false);
  });

  es.addEventListener('action', e => {
    const { action, index, total } = JSON.parse(e.data);
    appendAction(action, index);
    updateCount(total);
    if (recording) {
      statusText.textContent = `Recording — ${total} action${total===1?'':'s'} captured`;
    }
  });

  es.addEventListener('status', e => {
    const { recording: r, actions } = JSON.parse(e.data);
    setRecording(r);
    if (!r && actions) updateCount(actions.length);
  });

  es.addEventListener('error', e => {
    try {
      const { message } = JSON.parse(e.data);
      statusText.textContent = `Error: ${message}`;
      statusDot.className = 'idle';
    } catch {}
  });

  es.addEventListener('ready', () => {
    statusText.textContent = 'Ready — click Record to start';
  });

  es.onerror = () => {
    statusText.textContent = 'Reconnecting…';
    es.close();
    setTimeout(connect, 2000);
  };
}

connect();
</script>
</body>
</html>
